# 格式:
#   分钟 小时 日期 月份 星期 扫描目标 检出后行为 所有者ID 唤醒ClamAV(Y/N)
#
# 支持的 cron 表达式:
#   *                  任意值
#   3                  指定数值
#   1-5                范围
#   */6                步长
#   1-10/2             范围步长
#   1,3,5,10-20/2      列表
#
# 星期字段为 0-7，0 和 7 通常都表示星期日。
# 可用 https://cron.ren/ 或 https://www.lddgo.net/common/cron 生成并检查表达式。
#
# 支持的检出后行为:
#   warn    只记录告警，不修改文件
#   move    将检出的文件移动到隔离目录 /quarantine
#   remove  直接删除检出的文件，请谨慎使用
#
# 唤醒ClamAV:
#   Y       扫描前唤醒处于睡眠状态的 ClamAV
#   N       不主动唤醒；ClamAV 睡眠时任务会跳过
#
# 注意:
#   - 路径包含空格时，必须使用英文双引号包裹，例如 "/scan/My Folder"。
#   - 不支持路径本身包含双引号。
#   - 请确认要启用的规则没有被注释。
#   - 自260708（社区应用1.0.0）起，该文件规则需以“元数据行+规则行”形式写入，否则webui难以识别和管理，
#     因此所有实例行均已注释，建议仅通过webui编辑定时规则。

# 每天 03:30 扫描 /scan 目录，仅记录告警。
# 30 3 * * * /scan warn admin001 N

# 每 6 小时扫描 /scan 目录，将检出的文件移动到隔离区。
# 0 */6 * * * /scan move admin001 Y

# 每周日 02:15 扫描 "/scan/My Folder" 目录，直接删除检出的文件。
# 15 2 * * 0 "/scan/My Folder" remove admin001 Y
